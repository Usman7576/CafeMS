# Weekly update proposals for everything this project is pinned to. CI runs on each one.
# The 7-day cooldown leaves time for a poisoned release to be caught before it is proposed here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 10
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
