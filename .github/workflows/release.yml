# Pushing a tag such as v1.0.0 publishes the source archive with its SHA-256 checksums, so anyone can
# check that what they deploy is exactly what was released:  sha256sum -c SHA256SUMS
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the archive and its checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="cafems-$TAG/" -o "cafems-$TAG.tar.gz" "$TAG"
          cp package-lock.json "cafems-$TAG-package-lock.json"
          sha256sum "cafems-$TAG.tar.gz" "cafems-$TAG-package-lock.json" > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "cafems-$TAG.tar.gz" "cafems-$TAG-package-lock.json" SHA256SUMS --title "$TAG" --notes "Verify with sha256sum -c SHA256SUMS"
