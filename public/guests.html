<!DOCTYPE html>
<html lang="en" class="app-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guests · CafeMS</title>
  <meta name="theme-color" content="#f8f7f5">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css?v=7.0">
  <link rel="stylesheet" href="css/style.css?v=7.4">
</head>
<body data-page="guests">
  <main class="content" id="main">
    <div class="page-head">
      <div><h2>Guests</h2><p>Loyalty members and their points, voucher codes, and what guests say about their visit.</p></div>
    </div>
    <section class="kpis" aria-label="Guest summary">
      <div class="kpi"><div class="icon-tile"><i data-icon="users"></i></div><div><small>Loyalty members</small><strong id="kMembers">0</strong><div class="sub" id="kMembersSub">Joined so far</div></div></div>
      <div class="kpi"><div class="icon-tile ok"><i data-icon="key"></i></div><div><small>Points held</small><strong id="kPoints">0</strong><div class="sub" id="kPointsSub">Worth Rs 0</div></div></div>
      <div class="kpi"><div class="icon-tile warn"><i data-icon="receipt"></i></div><div><small>Active vouchers</small><strong id="kVouchers">0</strong><div class="sub" id="kVouchersSub">Codes in use</div></div></div>
      <div class="kpi"><div class="icon-tile info"><i data-icon="check-circle"></i></div><div><small>Guest rating</small><strong id="kRating">—</strong><div class="sub" id="kRatingSub">No ratings yet</div></div></div>
    </section>
    <div class="tabs scroll page-tabs" role="tablist" aria-label="Guest sections" id="guestTabs">
      <button class="tab" role="tab" data-tab="gMembers" aria-selected="true">Members</button>
      <button class="tab" role="tab" data-tab="gVouchers" aria-selected="false">Vouchers</button>
      <button class="tab" role="tab" data-tab="gFeedback" aria-selected="false">Feedback</button>
    </div>
    <div id="gMembers" class="page-tab"></div>
    <div id="gVouchers" class="page-tab" hidden></div>
    <div id="gFeedback" class="page-tab" hidden></div>
  </main>
  <script src="js/icons.js?v=7.4"></script>
  <script src="vendor/simplewebauthn-browser.umd.min.js?v=14.0.0"></script>
  <script src="js/common.js?v=7.4"></script>
  <script src="js/validate.js?v=7.0"></script>
  <script src="js/store.js?v=7.4"></script>
  <script src="js/app.js?v=7.4"></script>
  <script src="js/guests.js?v=7.4"></script>
</body>
</html>
